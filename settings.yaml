enabled:
  type: bool
  default: false
  description: "Enable the welcome modal feature. When disabled, no modals will be shown to any users."
feature_enabled_date:
  type: string
  default: "2026-02-06"
  description: "Date when the welcome modal feature was first enabled (YYYY-MM-DD format). Only used to split the audience: users who registered before this date count as 'returning users', users who registered on or after it count as 'new users'. Anonymous visitors match neither, so they only see cards set to 'both'."
card_layout:
  type: enum
  default: "grid"
  description: "Layout style for welcome cards: 'grid' shows cards in a responsive grid, 'list' shows cards in a vertical list with images on the side."
  choices:
    - grid
    - list
card_content:
  type: objects
  default: []
  description: "Configure the welcome cards displayed in the modal. The modal is shown on every visit, to signed-in users and anonymous visitors alike. Each card can be shown to specific user types (new users, returning users, or both)."
  schema:
    name: community_card
    properties:
      id:
        type: string
        required: true
        description: "Unique identifier for this card (used internally, not displayed to users)"
      title:
        type: string
        required: true
        description: "Main heading text for the card"
      subtitle:
        type: string
        required: true
        description: "Descriptive text shown below the title"
      imgUrl:
        type: upload
        required: true
        description: "Image to display on the card"
      altText:
        type: string
        required: true
        description: "Accessibility text describing the image"
      btnLabel:
        type: string
        required: true
        description: "Text displayed on the card's action button (e.g., 'Learn More', 'Get Started')"
      action:
        type: string
        required: true
        description: "URL or route to navigate to when button is clicked. Use full URLs for external links (https://example.com) or Discourse routes (/categories, /latest, etc.)"
      displayFor:
        type: enum
        required: true
        description: "Control which users see this card based on their status"
        choices:
          - both
          - new_users
          - returning_users